# Create an Octopus Deploy release when a GitHub Release is published.
# Uses the Octopus CLI (pre-installed on self-hosted runners; install step only on ubuntu-latest).
#
# Required secrets:
#   OCTOPUS_SERVER_URL  e.g. http://payton-desktop:8065
#   OCTOPUS_API_KEY
# Optional:
#   OCTOPUS_SPACE       default Default
#
# Project: RomM | Lifecycle: RomM Auto Deploy → Production (PAYTON-DESKTOP)

name: Octopus deploy on GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (e.g. v1.0.0). Defaults to latest release tag if empty."
        required: false
        type: string

permissions:
  contents: read

jobs:
  octopus-release:
    name: Create Octopus release + deploy
    # LAN Octopus: use self-hosted runner with Octopus CLI installed.
    # For public runners, switch to ubuntu-latest (install step runs automatically).
    runs-on: [self-hosted, windows, windows-local]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Normalize version from tag
        id: ver
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "No release tag available" }
          $ver = $tag.TrimStart('v', 'V')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Octopus release version=$ver (tag=$tag)"

      - name: Ensure Octopus CLI
        run: |
          $cmd = Get-Command octopus -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "octopus CLI not on PATH; installing via winget/choco is environment-specific."
            Write-Host "On GitHub-hosted Ubuntu, add: uses: OctopusDeploy/install-octopus-cli-action@v3"
            throw "octopus CLI not found. Install Octopus CLI on this runner."
          }
          octopus version

      - name: Create Octopus release
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_URL)) { $env:OCTOPUS_URL = $env:OCTOPUS_SERVER_URL }
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_SPACE)) { $env:OCTOPUS_SPACE = 'Default' }
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_URL) -or [string]::IsNullOrWhiteSpace($env:OCTOPUS_API_KEY)) {
            throw 'Missing OCTOPUS_SERVER_URL / OCTOPUS_URL or OCTOPUS_API_KEY'
          }

          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $notes = @"
          GitHub Release: ${{ github.event.release.html_url }}
          Tag: $tag
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}

          ${{ github.event.release.body }}
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "octopus-release-notes.txt"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          octopus release create `
            --project RomM `
            --version $ver `
            --channel Default `
            --release-notes-file $notesFile `
            --git-resource "redeploy-romm-docker-stack:romm:$tag" `
            --ignore-existing `
            --no-prompt `
            --space $env:OCTOPUS_SPACE

          Write-Host "Created Octopus release $ver (git ref $tag)"

      - name: Deploy to Production
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_URL)) { $env:OCTOPUS_URL = $env:OCTOPUS_SERVER_URL }
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_SPACE)) { $env:OCTOPUS_SPACE = 'Default' }
          $ver = "${{ steps.ver.outputs.version }}"

          # Lifecycle auto-deploys Production; explicit deploy ensures it runs.
          octopus release deploy `
            --project RomM `
            --version $ver `
            --environment Production `
            --space $env:OCTOPUS_SPACE `
            --no-prompt `
            -f basic
